name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
    env:
      BUNDLE_WITHOUT: "secryst"
      SKIP_JS: "1"
      # cross-compiler execution specs need a pip-installed python
      # interscript module; that coverage is owned by the per-runtime
      # repos' CI (same split as SKIP_JS)
      SKIP_PYTHON: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap packages
        run: ruby bootstrap.rb
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      - name: Install Python helper and gems
        working-directory: ruby
        run: |
          pip install regex
          bundle install --with=jsexec
      - name: RSpec
        working-directory: ruby
        run: bundle exec rspec

